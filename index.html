<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Line Check</title>
<meta name="description" content="Final inspection of pre-insulated phenolic duct: scan a label, tick each criterion, download the taglist checklist and the hourly defect checklist.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15212B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one working column, sticky header. Scan a label, tap pass or fail on large buttons, hourly board shows defects per hour of the shift. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#15212B; --muted:#5B6B78; --line:#D3DAE0;
  --accent:#1D5BBF; --accent-ink:#FFFFFF;
  --pass:#17794B; --pass-bg:#DDF2E7; --fail:#B42318; --fail-bg:#FCE4E1; --warn:#94600A; --warn-bg:#FBEBC8;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1820; --surface:#17232D; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3946;
    --accent:#6FA3F2; --accent-ink:#0B1722;
    --pass:#55C98C; --pass-bg:#123525; --fail:#FF8A7D; --fail-bg:#3E1A17; --warn:#F0B95A; --warn-bg:#3A2B0B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1820; --surface:#17232D; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3946;
  --accent:#6FA3F2; --accent-ink:#0B1722;
  --pass:#55C98C; --pass-bg:#123525; --fail:#FF8A7D; --fail-bg:#3E1A17; --warn:#F0B95A; --warn-bg:#3A2B0B;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:1.75rem;font-weight:700;margin:20px 0 12px}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.4rem;font-weight:700}
.mark{width:22px;height:22px;border:3px solid var(--ink);border-radius:50%;position:relative;display:inline-block}
.mark::after{content:"";position:absolute;left:3px;top:3px;width:10px;height:5px;border-left:3px solid var(--pass);border-bottom:3px solid var(--pass);transform:rotate(-45deg)}
.store{font:600 .72rem var(--f-body);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.store.on{color:var(--pass);border-color:var(--pass)}
.store.bad{color:var(--fail);border-color:var(--fail)}
.tabs{display:flex;gap:6px}
.tab{font:500 .95rem var(--f-body);min-height:44px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding-block:4px 120px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.card[data-state="fail"]{border-color:var(--fail)}
.card[data-state="pass"]{border-color:var(--pass)}
.stack{display:grid;gap:12px}
.sub{margin:24px 0 10px;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-body);font-weight:600}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hint{font-size:.82rem;color:var(--muted)}
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
label,.dlabel{font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 12px;min-height:48px;width:100%;min-width:0}
textarea{padding:10px 12px;resize:vertical}
.scanrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
#f-code{font:500 1.3rem var(--f-data);min-height:56px}
.btn{font:600 1rem var(--f-body);min-height:52px;padding:0 20px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{min-height:44px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.err{color:var(--fail);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stageseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stageseg .opt{min-height:56px;font-size:.95rem;line-height:1.2;padding:0 6px}

.pill{font:600 .78rem var(--f-body);padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.pass{background:var(--pass-bg);color:var(--pass);border-color:var(--pass)}
.pill.fail{background:var(--fail-bg);color:var(--fail);border-color:var(--fail)}
.pill.na{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.seg.tri{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{font:600 1.05rem var(--f-body);min-height:56px;border-radius:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt.pass[aria-pressed="true"]{background:var(--pass-bg);border-color:var(--pass);color:var(--pass)}
.opt.fail[aria-pressed="true"]{background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}
.opt.na[aria-pressed="true"]{background:var(--surface);border-color:var(--muted);color:var(--muted)}
.opt.stg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chead h3{min-width:0}
.detail{margin-top:12px;display:grid;gap:6px}

.runhead .meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prog{height:8px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.submitbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.submitbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.submitbar .msg{flex:1 1 200px;min-width:0;font-size:.92rem}
.verdictcard{display:grid;gap:8px}
.verdict{font-size:2.6rem;margin:0;font-family:var(--f-display);font-weight:700}
.verdictcard.pass .verdict{color:var(--pass)}
.verdictcard.fail .verdict{color:var(--fail)}
.fitem{padding-top:8px;border-top:1px dashed var(--line)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:10px 14px;margin:12px 0;font-size:.92rem}

.list{padding:4px 16px}
.prow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.prow:last-child{border-bottom:0}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.stat .n{font:600 2rem var(--f-display);font-variant-numeric:tabular-nums}
.stat .t{font-size:.82rem;color:var(--muted)}
.hours{padding:4px 16px;margin-top:12px}
.hrow{display:grid;grid-template-columns:6.6rem minmax(0,1fr) 2.4rem;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hlabel{font:500 .9rem var(--f-data);font-variant-numeric:tabular-nums}
.hbar{display:flex;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--fail)}
.hnum{font:700 1.3rem var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.hrow.zero .hnum{color:var(--muted);font-weight:500}
.hrow.future{opacity:.5}
.hmeta{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
details.rec{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.rec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:56px}
details.rec>summary::-webkit-details-marker{display:none}
details.rec>summary .grow{flex:1 1 180px;min-width:0}
details.rec .body{padding:0 16px 14px;display:grid;gap:8px}
.when{color:var(--muted);font-size:.85rem}
.csv{width:100%;min-height:110px;font:400 .8rem var(--f-data);margin-top:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:.95rem;font-weight:500;color:var(--ink)}
.check input{width:22px;min-height:22px;height:22px}

.stats4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.85rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.camwrap{position:relative;margin-top:10px;display:grid;gap:10px}
#camv{width:100%;max-height:300px;background:#000;border-radius:8px;object-fit:cover}
.camline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--fail);opacity:.8;pointer-events:none}
.pieces{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rule{font-size:.82rem;color:var(--muted);margin-top:4px}
.rule.req{color:var(--warn);font-weight:500}
.card.auto[data-state="na"]{opacity:.62}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.rules{grid-template-columns:minmax(0,1fr)}}
.opt.pc{min-height:48px;font-size:.92rem;padding:0 14px;flex:0 0 auto;font-family:var(--f-data)}
.opt.pc.done{border-style:dashed;color:var(--muted)}
.opt.pc[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

@media (max-width:560px){
  .filters{grid-template-columns:minmax(0,1fr)}
  .verdict{font-size:2rem}
  .stats{gap:8px}
  .stats4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .maps{grid-template-columns:minmax(0,1fr)}
}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:12px}
.doc h1{font-size:1.35rem;font-weight:700;letter-spacing:.02em}
.doc .co{font-size:.9rem;color:var(--muted);margin-top:2px}
.dmeta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:14px 0;font-size:.88rem}
.dmeta div{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:4px 0;min-width:0}
.dmeta b{font-weight:600;color:var(--muted);min-width:7.5em}
.dmeta span{overflow-wrap:anywhere}
.doct{border-collapse:collapse;width:100%;min-width:1180px;font-size:.72rem}
.doct th,.doct td{border:1px solid var(--line);padding:3px 5px;text-align:left;white-space:nowrap}
.doct thead th{background:var(--bg);font-weight:600;text-align:center;font-size:.68rem}
.doct td.c{text-align:center;font-weight:700;width:1.6rem}
.doct td.pass{color:var(--pass)}
.doct td.fail{color:var(--fail)}
.doct td.na{color:var(--muted);font-weight:400;font-size:.62rem}
.doct td.rem{white-space:normal;min-width:140px;font-size:.68rem}
.doct td.st{text-align:center;font-weight:700}
.doct td.st.A{color:var(--pass)}.doct td.st.RWK{color:var(--warn)}.doct td.st.R{color:var(--fail)}
.sig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px;font-size:.85rem}
.sig div{border-top:1px solid var(--line);padding-top:8px}
.sig .ln{display:inline-block;min-width:150px;border-bottom:1px dotted var(--muted);margin-left:6px}
.dleg{margin-top:14px;font-size:.75rem;color:var(--muted)}
.dleg table{min-width:0;font-size:.75rem}
.dleg td{border:0;padding:2px 10px 2px 0;white-space:normal}
@media print{
  .top,.submitbar,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  main{padding:0}
  .wrap{max-width:none}
  .doc{border:0;padding:0;margin:0;background:#fff}
  .tablewrap{overflow:visible;border:0;background:#fff}
  .doct{min-width:0;font-size:6.5pt}
  .doct th,.doct td{border-color:#888}
  .doct thead th{background:#eee}
  @page{size:A4 landscape;margin:8mm}
}
@media (max-width:560px){.dmeta,.sig{grid-template-columns:minmax(0,1fr)}}
.grp .items{display:grid;margin-top:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.irow:first-child{border-top:0}
.irow .itxt{display:grid;gap:2px;min-width:0}
.ilabel{font-size:.93rem}
.irow.off{opacity:.5}
.imark{font:700 1.05rem var(--f-body);min-width:2.4em;text-align:right}
.imark.pass{color:var(--pass)}.imark.fail{color:var(--fail)}.imark.na{color:var(--muted);font-size:.75rem;font-weight:600}
.irow .seg.mini,.irow .detail{grid-column:1/-1;margin-top:6px}
.seg.mini .opt{min-height:44px;font-size:.95rem}
.grp[data-state="pass"]{border-color:var(--pass)}
.grp[data-state="fail"]{border-color:var(--fail)}
.grp[data-state="na"]{opacity:.62}
.grp .seg .opt{min-height:58px}
.runhead .chips .pill{font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast.bad{background:var(--fail);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Line Check</h1><span class="store" id="store">This device only</span><button type="button" class="btn ghost" id="installbtn" hidden style="min-height:36px;padding:0 12px;font-size:.85rem">Install</button></div>
  <nav class="tabs" aria-label="Sections">
    <button type="button" class="tab" id="tab-check" data-view="check">Check</button>
    <button type="button" class="tab" id="tab-hourly" data-view="hourly">Hourly</button>
    <button type="button" class="tab" id="tab-log" data-view="log">Log</button>
    <button type="button" class="tab" id="tab-taglist" data-view="taglist">Taglist</button>
  </nav>
</div></header>
<div class="wrap"><main id="main"></main></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="submitbar" id="bar" hidden><div class="wrap">
  <button type="button" class="btn ghost" id="btn-cancel" data-act="cancel">Discard</button>
  <p class="msg" id="bar-msg" role="status"></p>
  <button type="button" class="btn primary" id="btn-submit" data-act="submit" disabled>Submit</button>
</div></div>

<script src="vendor/xlsx.min.js"></script>
<script>
//#PURE-START
const STAGES={final:{label:'Final inspection',short:'Final'}};
const STAGE_ORDER=['final'];
/* Defect codes for the hourly defect checklist. Every checklist item carries one,
   so a failed item tallies itself into the right column. */
const CODES=[
  ['D','Dimensions, extension or orientation differ from the sketch/drawing.'],
  ['T','Tape peel, tape wrinkles, or is missing where required (including foil tape on a plain end).'],
  ['S','Silicone sealing has gaps or misses a joint or corner, or a joined part is not sealed.'],
  ['L','Acoustic liner is loose, liner cloth damaged, glasswool exposed, adhesive poor, or stick-up pins loose or missing.'],
  ['F','A required tiger clip, tie rod, turning vane / splitter vane is missing, loose or misplaced.'],
  ['B','Board is crushed, punctured or delaminated, or phenolic is exposed at a finished joint.'],
  ['FL','End flange, end cap or connector is missing, loose, damaged, or not the type on the taglist.'],
  ['O','Finish or identification: glue stains, marks or debris, or a missing or wrong label.']
];
const CODE_KEYS=CODES.map(c=>c[0]);
/* The inspector confirms a whole group with one tap; a group opens into its items only when something fails. */
const GROUPS=[['dim','Dimensions'],['con','Construction'],['end','Ends'],['lin','Liner'],['sea','Sealing & finish']];
/* g = group, h = column head, a = short head for the PDF, code = defect code,
   na = may be N/A, cond = required only for some pieces (decided by pieceRules) */
const FINAL=[
  {id:'f1', a:'Dim',g:'dim',h:'Dim',     code:'D', label:'Dimensions and extension match the sketch/drawing'},
  {id:'f2', a:'Ori',g:'dim',h:'Orient',  code:'D', cond:'orient',label:'Orientation of pieces matches the drawing'},
  {id:'f3', a:'Nck',g:'dim',h:'Neck',    code:'D', cond:'neck',label:'Neck size and machine connection as drawing'},
  {id:'f4', a:'Brd',g:'con',h:'Board',   code:'B', label:'Board condition: no crush, puncture or delamination'},
  {id:'f9', a:'Clp',g:'con',h:'Clips',   code:'F', cond:'clips',label:'Tiger clips (panel fasteners): spacing along seams and corners as the standard'},
  {id:'f10',a:'Rod',g:'con',h:'Rods',    code:'F', cond:'rods',label:'Tie rods: number and location as the standard'},
  {id:'f11',a:'Van',g:'con',h:'Vanes',   code:'F', cond:'vanes',label:'Turning vanes or splitter vanes: number and fixing as the standard'},
  {id:'f7', a:'LS', g:'end',h:'LS end',  code:'FL',cond:'ends',label:'LS end: flange, end cap or tape as the taglist, fitted and undamaged'},
  {id:'f8', a:'SS', g:'end',h:'SS end',  code:'FL',cond:'ends',label:'SS end: flange, end cap or tape as the taglist, fitted and undamaged'},
  {id:'f13',a:'Lin',g:'lin',h:'Liner',   code:'L', cond:'liner',label:'Acoustic liner applied, edges tucked, not loose'},
  {id:'f14',a:'Pin',g:'lin',h:'Pins',    code:'L', cond:'liner',label:'Stick-up pins: correct number, firmly fixed'},
  {id:'f15',a:'Adh',g:'lin',h:'Adh',     code:'L', cond:'liner',label:'Adhesive applied properly'},
  {id:'f16',a:'Clo',g:'lin',h:'Cloth',   code:'L', cond:'liner',label:'Liner cloth undamaged, no glasswool exposed'},
  {id:'f18',a:'Sil',g:'sea',h:'Silicone',code:'S', label:'Silicone sealant complete inside joints and corners'},
  {id:'f20',a:'ETp',g:'sea',h:'Ext tape',code:'T', label:'External tape: correct type and size, fully bonded'},
  {id:'f21',a:'Cln',g:'sea',h:'Clean',   code:'O', label:'Clean: no glue stains, marks or debris'},
  {id:'f22',a:'Lbl',g:'sea',h:'Label',   code:'O', label:'Kanban sticker or label present and correct'}
];
const FINAL_GROUPS=GROUPS.map(g=>[g[1],FINAL.filter(i=>i.g===g[0]),g[0]]);
function checklistFor(stage){return FINAL}
function groupName(gid){const g=GROUPS.find(x=>x[0]===gid);return g?g[1]:gid}

/* ---- reading a taglist row ---- */
/* End codes in the LS and SS columns */
function endInfo(v){
  const s=String(v==null?'':v).trim(),u=s.toUpperCase().replace(/\s+/g,'');

  if(u==='IF') return {t:'Invisible flange',chk:'fitted tight, undamaged',code:'FL'};
  if(u==='U') return {t:'U flange',chk:'fitted tight, undamaged',code:'FL'};
  if(u==='F') return {t:'F flange',chk:'fitted tight, undamaged',code:'FL'};
  if(u==='H') return {t:'H / chair flange',chk:'fitted tight, undamaged',code:'FL'};
  if(u==='WC') return {t:'WC, without connector',chk:'no metal connector, end finished as the drawing',code:'FL'};
  if(u==='PLAIN') return {t:'Plain',chk:'foil tape covers the phenolic at the end',code:'T'};
  if(/JOIN/.test(u)) return {t:'Join',chk:'joined to the next part, joint sealed and taped',code:'S',join:true};

  [1600,'','1C','2@600','2@600','3@600'],[1700,'','1@600','2@600','2@600','3@600'],
  [1800,'1C','1@600','2@600','2@600','3@600'],[1900,'1C','1@600','2@600','3@600','3@600'],

/* A joined assembly is inspected once. An item is needed if any part needs it. */
function mergeRules(parts){
  if(parts.length===1) return parts[0].app;
  const out={},ids=[];
  parts.forEach(p=>Object.keys(p.app).forEach(id=>{if(ids.indexOf(id)<0) ids.push(id)}));
  ids.forEach(id=>{
    const rs=parts.map(p=>({tag:p.tag,r:p.app[id]})).filter(x=>x.r);
    const on=rs.some(x=>x.r.on),unknown=rs.some(x=>x.r.on&&x.r.unknown);
    const whys=[];rs.forEach(x=>{if(x.r.why&&whys.indexOf(x.r.why)<0) whys.push(x.r.why)});
    const why=whys.length<=1?(whys[0]||''):rs.filter(x=>x.r.why).map(x=>x.tag+': '+x.r.why).join(' | ');
    const c=rs.find(x=>x.r.on&&x.r.code);
    out[id]={on,unknown,why,code:c?c.r.code:undefined};
  });

/* items the rules say a piece does not need start as N/A */

  const d=new Date(ts),h=d.getHours();

  if(h>=19) return {date:dateKey(d),shift:'Night',slot:h-19,hour:h};
  const p=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);

function slotHour(shift,slot){return shift==='Day'?7+slot:(slot<=4?19+slot:slot-5)}

/* ---------- Storage on the phone ----------

   Only recent records are kept in memory (the last 7 days, or back to the oldest taglist still
   loaded, at most 62 days); older shifts are read from the phone when the Hourly tab asks for them,
   and everything comes out with "Download all records". */
const KEEP_DAYS=7,MAX_DAYS=62;

function loadWindow(tls){
  const now=Date.now(),oldest=tls.reduce((m,t)=>Math.min(m,t.at||now),now);

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('IndexedDB is not available'));
    let rq;try{rq=indexedDB.open('line-check',1)}catch(e){return rej(e)}
    rq.onupgradeneeded=()=>{
      const d=rq.result;
      if(!d.objectStoreNames.contains('records')){const s=d.createObjectStore('records',{keyPath:'id'});s.createIndex('ts','ts')}
      if(!d.objectStoreNames.contains('taglists')) d.createObjectStore('taglists',{keyPath:'id'});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error('IndexedDB failed'));
    rq.onblocked=()=>rej(new Error('IndexedDB blocked'));
  });
}
function idbTx(name,mode,fn){
  return new Promise((res,rej)=>{
    let tx;try{tx=store.db.transaction(name,mode)}catch(e){return rej(e)}
    const os=tx.objectStore(name);let out;
    const r=fn(os);if(r) r.onsuccess=()=>{out=r.result};
    tx.oncomplete=()=>res(out);
    tx.onerror=()=>rej(tx.error||new Error('write failed'));
    tx.onabort=()=>rej(tx.error||new Error('write aborted'));
  });
}

/* The inspector's device is the record of truth: every inspection is written here first.
   A shared copy is only kept when the viewer is signed in and allowed to write. */
function startDb(){
  if(!(window.claude&&window.claude.use)) return;
  window.claude.use('db').then(db=>{
    if(!db) return;
    shared=db;
    db.collection('checks').orderBy('ts','desc').limit(1000).onSnapshot(snap=>{
      const have={};records.forEach(r=>{have[r.id]=1});
      const added=[];
      snap.docs.forEach(d=>{const v=d.data();if(v&&v.id&&!have[v.id]){records.push(v);have[v.id]=1;added.push(v)}});
      if(added.length){
        records.sort((a,b)=>b.ts-a.ts);
        if(store.mode==='idb') dbPutMany('records',added).catch(()=>{});else lsSet('lc2-records',JSON.stringify(records));
        refreshData();

  code=String(code||'').trim();

  if(parseCommand(code)) return fail('That is a command card. Scan a duct label first.');

  const units=hit?unitsFor(hit.entry,asm):[{uid:normKey(code)+'#1',k:normKey(code),n:1,q:1,e:null,tag:code}];
  const parts=asm?asm.members.map(e=>({tag:e.tag,e,app:pieceRules(e,rules)}))

function refreshBar(){

async function submitRun(){
  if(!run||openCount(run.app,run.answers)>0||!run.sel.length) return false;
  const r0=run;run=null;saveErr=null;lastBatch=[];lastCode=r0.code;
  for(const uid of r0.sel){
    const u=r0.units.find(x=>x.uid===uid);if(!u) continue;
    const e=u.e,ts=Date.now();
    let app=r0.app,ans=r0.answers;
    if(r0.asm){
      const part=r0.parts.find(p=>p.e&&e&&p.e.k===e.k);
      if(part){
        app=Object.assign({},r0.app);
        for(const id in part.app){
          if(!part.app[id].on) app[id]=part.app[id];
          else if(part.app[id].code) app[id]=Object.assign({},app[id],{code:part.app[id].code});
        }
        ans=answersForPart(r0.answers,part.app);
      }
    }
    const rec=buildRecord('final',e?(e.raw||e.k):r0.code,ans,ts,'C'+ts.toString(36)+Math.random().toString(36).slice(2,6)+u.n,r0.inspector,
      e?{tag:e.tag,taglist:e.tl,desc:e.desc,qty:e.q,pieceNo:u.n,perPiece:e.pp,liner:linerOf(e),asm:r0.asm?r0.asm.base:'',app}:{pieceNo:1,app});
    try{await saveRecord(rec);lastBatch.push(rec)}
    catch(err){saveErr=(err&&err.message)||'The record could not be saved.';break}
  }
  lastRec=lastBatch[0]||null;
  mode='done';render();
  return true;
}

  const asm=asmIndex[hit.entry.k]||null,units=unitsFor(hit.entry,asm),d=doneUnits(units);
  return units.filter(u=>!d[u.uid]);
}

/* ---------- Scanner input outside a text box: labels and command cards ---------- */
let kb={buf:'',t:0};
document.addEventListener('keydown',e=>{
  const tg=e.target,typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
  if(typing||view!=='check'||e.ctrlKey||e.metaKey||e.altKey) return;
  const now=Date.now();
  if(now-kb.t>150) kb.buf='';
  kb.t=now;
  if(e.key==='Enter'){const c=kb.buf.trim();kb.buf='';if(c.length>=3){e.preventDefault();handleScan(c)}return}
  if(e.key&&e.key.length===1) kb.buf+=e.key;
});
async function handleScan(code){
  const cmd=parseCommand(code);
  if(cmd){
    if(mode!=='run'||!run){toast('Scan a duct label first.',true);return}
    if(cmd[2]==='gok'){
      if(groupState(cmd[3],run.app,run.answers)==='na'){toast(groupName(cmd[3])+': not needed on this piece.');return}
      run.answers=groupOk(cmd[3],run.app,run.answers);run.open[cmd[3]]=false;refreshGroup(cmd[3]);
      const st=groupState(cmd[3],run.app,run.answers);
      toast(st==='open'?groupName(cmd[3])+': an item still needs your answer.':cmd[1],st==='open');
    }else if(cmd[2]==='all'){
      const d=doneUnits(run.units),left=run.units.filter(u=>!d[u.uid]);
      if(left.length) run.sel=left.map(u=>u.uid);
      const box=$('#pcbox');if(box) box.innerHTML=piecesHTML();refreshBar();
      toast(run.sel.length+(run.sel.length===1?' piece':' pieces')+' selected');
    }else if(cmd[2]==='submit'){
      const n=openCount(run.app,run.answers);
      if(n||!run.sel.length){toast(n?'Not submitted: '+n+(n===1?' item':' items')+' still open.':'Choose a piece first.',true);return}
      await submitRun();toast('Submitted.');
    }else if(cmd[2]==='discard'){run=null;mode='scan';render();toast('Check discarded.')}
    return;
  }
  if(mode==='run'&&run){
    if(run.units.some(u=>u.k===normKey(code))){toast('This label is already open.');return}
    const n=openCount(run.app,run.answers);
    if(!n&&run.sel.length){await submitRun();startRun(code);toast('Previous check submitted.')}
    else toast('Finish this check first: '+(n?n+(n===1?' item':' items')+' open':'choose a piece')+'. Or scan Discard.',true);
    return;
  }
  startRun(code);
}
/* Command cards: Code 128 barcodes drawn into a PDF to print and laminate */
async function commandCardsPdf(){
  try{await loadScript(JSPDF_URL)}catch(e){return 'The PDF builder could not load. Connect to the internet once.'}
  const JS=window.jspdf&&window.jspdf.jsPDF;
  if(!JS) return 'The PDF builder did not start.';
  const doc=new JS({orientation:'portrait',unit:'mm',format:'a4'});
  const M=12,G=8,cw=(210-2*M-G)/2,ch=58;
  doc.setFont('helvetica','bold');doc.setFontSize(12);
  doc.text('Line Check — command cards for the ring scanner',M,10);
  COMMANDS.forEach((c,i)=>{
    const x=M+(i%2)*(cw+G),y=16+Math.floor(i/2)*(ch+G);
    doc.setDrawColor(150,150,150);doc.setLineWidth(0.3);doc.rect(x,y,cw,ch);
    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(20,30,40);
    doc.text(c[1],x+cw/2,y+11,{align:'center'});
    const mods=code128(c[0]),total=mods.reduce((a,b)=>a+b,0)+20,mw=Math.min(0.5,(cw-6)/total);
    let bx=x+(cw-total*mw)/2+10*mw;
    doc.setFillColor(0,0,0);
    mods.forEach((w,j)=>{if(j%2===0) doc.rect(bx,y+17,w*mw,26,'F');bx+=w*mw});
    doc.setFont('courier','normal');doc.setFontSize(9);
    doc.text(c[0],x+cw/2,y+49,{align:'center'});
  });
  return saveOut('line-check-command-cards.pdf',doc.output('arraybuffer'));
}

function curDocTl(){return taglists.find(t=>t.id===docId)||null}
function downloadFile(name,mime,content){
  try{
    const b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},0);
    return true;
  }catch(e){return false}
}
/* Inside the Claude viewer a file reaches the person only through the downloads
   capability, which asks them to confirm. A plain browser gets the link instead. */
async function saveOut(filename,data){
  let cap=null;
  try{if(window.claude&&window.claude.use) cap=await window.claude.use('downloads')}catch(e){}
  if(cap){
    try{
      const r=await cap.save({filename,data});
      return (r&&r.status==='delivered')?'Sent '+filename+' on.':'Saved '+filename+'.';
    }catch(e){
      const c=e&&e.code;
      if(c==='declined') return 'Download cancelled.';
      if(c==='rate_limited') return 'A download is already waiting for an answer. Try again in a moment.';
      if(c==='too_large') return 'That file is too big to save here.';
      return 'The download could not be saved'+(c?' ('+c+')':'')+'.';
    }
  }
  const ext=(filename.split('.').pop()||'').toLowerCase();
  const mime={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    csv:'text/csv;charset=utf-8',html:'text/html;charset=utf-8'}[ext]||'application/octet-stream';
  return downloadFile(filename,mime,data)?'Saved '+filename+' to your downloads.':'This browser blocked the download.';
}
async function sheetDownload(base,aoa){
  let name='',data=null,note='';

      data=XLSX.write(wb,{bookType:'xlsx',type:'array'});name=base+'.xlsx';
    }catch(e){data=null}
  }
  if(!data){name=base+'.csv';data=aoaCsv(aoa);note=' Excel was not available, so this is a CSV. It opens in Excel.'}
  return (await saveOut(name,data))+note;
}

async function pdfDownload(t,pr,m,base){
  try{

  doc.setFont('helvetica','normal');doc.setFontSize(8);
  if(m.company) doc.text(String(m.company),L,17);

    ['Passed area',m2(pr.passedArea)+' m2'],['Lined area passed',m2(pr.linerArea)+' m2']];
  let y=22;
  pairs.forEach((pr2,i)=>{
    const x=L+(i%2)*((W-2*L)/2);
    if(i%2===0&&i) y+=4.4;
    doc.setFont('helvetica','bold');doc.text(pr2[0],x,y);

  });
  const h1=[{content:'SL',rowSpan:2},{content:'Tag ID',rowSpan:2},{content:'Description',rowSpan:2}];
  FINAL_GROUPS.forEach(g=>h1.push({content:g[0],colSpan:g[1].length}));
  h1.push({content:'Remarks',rowSpan:2},{content:'A/R/RWK',rowSpan:2});
  const marks=[];
  const body=pr.rows.map(r=>{
    const cells=[r.sl,r.tag,r.e.desc],mk={};

      const v=r.crit[it.id];
      mk[3+ci]=v;

  const colStyles={0:{cellWidth:7},1:{cellWidth:20},2:{cellWidth:24},
    [3+FINAL.length]:{cellWidth:28},[4+FINAL.length]:{cellWidth:12}};
  FINAL.forEach((it,i)=>{colStyles[3+i]={cellWidth:(W-2*L-91)/FINAL.length,halign:'center'}});
  doc.autoTable({
    head:[h1,FINAL.map(it=>it.a||it.h)],body,startY:y+5,margin:{left:L,right:L,top:12,bottom:14},
    theme:'grid',styles:{fontSize:4.8,cellPadding:0.7,lineWidth:0.1,lineColor:[150,150,150],overflow:'linebreak'},
    headStyles:{fillColor:[235,238,240],textColor:[20,30,40],fontSize:4.6,halign:'center',valign:'middle',lineWidth:0.1},
    bodyStyles:{textColor:[20,30,40]},columnStyles:colStyles,
    didDrawCell:d=>{
      if(d.section!=='body') return;
      const v=marks[d.row.index]&&marks[d.row.index][d.column.index];
      if(v!=='pass'&&v!=='fail') return;
      const x=d.cell.x+d.cell.width/2,c=d.cell.y+d.cell.height/2;
      doc.setLineWidth(0.3);
      if(v==='pass'){doc.setDrawColor(23,121,75);doc.line(x-1.1,c,x-0.3,c+0.9);doc.line(x-0.3,c+0.9,x+1.1,c-1)}
      else{doc.setDrawColor(180,35,24);doc.line(x-0.9,c-0.9,x+0.9,c+0.9);doc.line(x-0.9,c+0.9,x+0.9,c-0.9)}
    }
  });
  let fy=doc.lastAutoTable.finalY+8;
  if(fy>doc.internal.pageSize.getHeight()-30){doc.addPage();fy=16}
  doc.setFontSize(8);
  const col2=L+(W-2*L)/2;
  doc.text('Checked by: '+(m.inspector||'________________'),L,fy);
  doc.text('Cross checked by: '+(m.cross||'________________'),col2,fy);
  doc.text('Date: ________________',L,fy+7);doc.text('Date: ________________',col2,fy+7);
  doc.text('Signature: ________________',L,fy+14);doc.text('Signature: ________________',col2,fy+14);
  doc.addPage();
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Inspection criteria',L,14);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);
  doc.text('Tick = accepted.  Cross = defect found.  -  = not applicable to this piece.  Blank = not inspected.',L,20);
  doc.text('A = approved,  R = rejected,  RWK = reworked and re-inspected.  Each group was confirmed by the inspector; a group tick covers every item in it.',L,24.5);
  let ly=32;
  FINAL_GROUPS.forEach(g=>{
    doc.setFont('helvetica','bold');doc.text(g[0],L,ly);
    doc.setFont('helvetica','normal');
    g[1].forEach(it=>{doc.text((it.a||it.h)+'  —  '+it.label+'   (code '+it.code+')',L+26,ly);ly+=4.4});
    ly+=1.6;
  });
  ly+=3;
  doc.setFont('helvetica','bold');doc.text('Conditional items',L,ly);ly+=4.4;
  doc.setFont('helvetica','normal');
  doc.splitTextToSize(rulesText(m.rules).replace(/°/g,' deg'),W-2*L).forEach(line=>{doc.text(line,L,ly);ly+=4.2});
  return saveOut(base+'.pdf',doc.output('arraybuffer'));
}

document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-view]');
  if(tab){view=tab.dataset.view;render();return}
  const b=e.target.closest('[data-act]');if(!b) return;
  const act=b.dataset.act;
  if(act==='pass'||act==='fail'||act==='na'){
    const row=b.closest('[data-id]');if(!row||!run) return;
    const it=FINAL.find(x=>x.id===row.dataset.id);if(!it) return;
    const a=run.answers[it.id]||(run.answers[it.id]={});a.r=act;delete a.auto;
    refreshGroup(it.g);
    if(act==='fail'){const ta=$('#nt-'+it.id);if(ta) ta.focus()}
  }
  else if(act==='gok'){
    if(!run) return;const g=b.dataset.g;
    run.answers=groupOk(g,run.app,run.answers);run.open[g]=false;refreshGroup(g);
  }
  else if(act==='gdef'){
    if(!run) return;const g=b.dataset.g;
    /* open the group item by item; what the inspector does not mark failed passes with the group */
    run.open[g]=true;run.answers=groupOk(g,run.app,run.answers);refreshGroup(g);
  }
  else if(act==='pick'||act==='pick-rest'){
    if(!run) return;
    if(act==='pick'){
      const u=b.dataset.u,i=run.sel.indexOf(u);
      if(i>=0) run.sel.splice(i,1);else run.sel.push(u);
    }else{
      const d=doneUnits(run.units);
      run.sel=run.units.filter(u=>!d[u.uid]).map(u=>u.uid);
    }
    const order=run.units.map(u=>u.uid);run.sel.sort((x,y)=>order.indexOf(x)-order.indexOf(y));
    const box=$('#pcbox');if(box) box.innerHTML=piecesHTML();
    refreshBar();
  }
  else if(act==='cancel'){
    if(b.dataset.armed){run=null;mode='scan';render();return}
    b.dataset.armed='1';b.textContent='Tap again to discard';
    setTimeout(()=>{delete b.dataset.armed;b.textContent='Discard'},4000);
  }
  else if(act==='submit'){b.disabled=true;await submitRun()}
  else if(act==='retry'){
    b.disabled=true;
    try{await saveRecord(lastRec);saveErr=null;if(lastBatch.indexOf(lastRec)<0) lastBatch.push(lastRec)}
    catch(err){saveErr=(err&&err.message)||'The record could not be saved.'}
    renderDone();
  }
  else if(act==='nextpiece'){startRun(lastCode)}
  else if(act==='next'){mode='scan';render()}
  else if(act==='cam'){await openCamera()}
  else if(act==='cam-stop'){closeCamera();camMsg('Camera closed.')}
  else if(act==='cards'){
    const msg=$('#cards-msg');msg.textContent='Preparing the file…';b.disabled=true;
    try{msg.textContent=await commandCardsPdf()}catch(err){msg.textContent='The cards could not be built.'}
    b.disabled=false;
  }
  else if(act==='doc'){docId=b.dataset.tl;view='doc';render()}
  else if(act==='doc-back'){view='taglist';render()}
  else if(act==='doc-pdf'||act==='doc-xlsx'||act==='doc-html'){
    const t=curDocTl();if(!t) return;
    const pr=taglistProgress(t,records),m=docMeta(t),base=safeName(t.name)+'-final-checklist';
    const msg=$('#dl-msg');msg.textContent='Preparing the file…';b.disabled=true;
    try{
      msg.textContent=act==='doc-pdf' ? await pdfDownload(t,pr,m,base)
        : act==='doc-xlsx' ? await sheetDownload(base,checklistAoa(t,pr,m))
        : (await saveOut(base+'.html',docHtml(t,pr,m)))+' Open it in a browser to read or print.';
    }catch(e){msg.textContent='That file could not be built'+(e&&e.message?' ('+e.message+')':'')+'.'}
    b.disabled=false;
  }
  else if(act==='hour-dl'){
    const h=hourlyCtx(),msg=$('#dl-msg');
    msg.textContent='Preparing the file…';b.disabled=true;
    msg.textContent=await sheetDownload('hourly-defects-'+h.date+'-'+h.shift.toLowerCase(),hourlyAoa(h.date,h.shift,inspector,h.b))
      +(h.s.real?'':' These are the example records, not real ones.');
    b.disabled=false;
  }
  else if(act==='allcsv'){
    const msg=$('#dl-msg');msg.textContent='Preparing the file…';b.disabled=true;
    let list=records;
    if(store.mode==='idb'){try{list=(await dbAll('records'))||records}catch(err){list=records}}
    list=list.slice().sort((x,y)=>x.ts-y.ts);
    msg.textContent=list.length?await saveOut('line-check-records-'+dateKey(new Date())+'.csv',recordsCsv(list))+' '+list.length+' records.':'No records yet.';
    b.disabled=false;
  }
  else if(act==='tl-cancel'){imp=null;tlMsg=null;renderTaglist()}
  else if(act==='rl-reset'){rules=Object.assign({},RULE_DEFAULTS);lsSet('lc5-rules',JSON.stringify(rules));renderTaglist()}
  else if(act==='tl-import'){
    if(!imp) return;
    const ent=makeEntries(imp.data,imp.map);
    if(!ent.rows.length) return;
    const groups=splitByTaglist(ent.rows,((imp.name||imp.fileName)||'').trim()||imp.fileName);
    const now=Date.now(),changed=[],replaced=[];
    groups.forEach((g,i)=>{
      const old=taglists.find(t=>t.name===g.name);
      const t={id:old?old.id:'T'+now.toString(36)+i,name:g.name,at:now,rows:g.rows,areaCol:imp.headers[imp.map.area]||'',
        pieces:g.pieces,project:(imp.project||'').trim()||(old?old.project:'')};
      if(old){taglists=taglists.filter(x=>x.id!==old.id);replaced.push(g.name)}
      taglists.unshift(t);changed.push(t);
    });
    reindex();
    if(await putTaglists(changed)) tlMsg={t:'ok',m:'Loaded '+groups.length+(groups.length===1?' taglist':' taglists')+', '+ent.pieces+' pieces.'+(replaced.length?' Replaced: '+replaced.join(', ')+'.':'')+(ent.noArea?' '+ent.noArea+' rows have no area.':'')};
    else tlMsg={t:'bad',m:'Not saved on this device: no room for that file. It is loaded until the app is closed.'};
    imp=null;renderTaglist();
  }
  else if(act==='tl-remove'){
    if(b.dataset.armed){const id=b.dataset.tl;taglists=taglists.filter(t=>t.id!==id);reindex();await dropTaglist(id);tlMsg=null;renderTaglist();return}
    b.dataset.armed='1';b.textContent='Tap again to remove';
    setTimeout(()=>{delete b.dataset.armed;b.textContent='Remove'},4000);
  }
  else if(act==='copycsv'){
    csvText=recordsCsv(source().list);
    try{await navigator.clipboard.writeText(csvText);b.textContent='Copied'}catch(err){b.textContent='Select and copy below'}
    const ex=$('#csv-out');
    if(ex) ex.value=csvText;else main.insertAdjacentHTML('beforeend',`<textarea class="csv" id="csv-out" readonly aria-label="Records as CSV">${esc(csvText)}</textarea>`);
    $('#csv-out').select();
  }
  else if(act==='copyhour'){
    const h=hourlyCtx(),txt=hourReport(h.date,h.shift,h.stageLabel,h.b);
    try{await navigator.clipboard.writeText(txt);b.textContent='Copied'}catch(err){b.textContent='Select and copy below'}
    const ex=$('#hr-out');
    if(ex) ex.value=txt;else main.insertAdjacentHTML('beforeend',`<textarea class="csv" id="hr-out" readonly aria-label="Hourly report">${esc(txt)}</textarea>`);
    $('#hr-out').select();
  }
});
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-inspector'){inspector=t.value;return}
  if(t.id==='tl-name'&&imp){imp.name=t.value;return}
  if(t.id==='tl-project'&&imp){imp.project=t.value;return}
  if(t.id&&t.id.indexOf('rl-')===0&&t.id!=='rl-bend'&&t.id!=='rl-press'){
    const k=t.id.slice(3),v=parseArea(t.value);
    if(v==null||v<0) return;
    rules[k]=v;
    lsSet('lc5-rules',JSON.stringify(rules));return;
  }
  if(t.id==='doc-project'){const x=curDocTl();if(x){x.project=t.value;putTaglists([x]);renderDocMetaOnly()}return}
  if(t.id&&t.id.indexOf('set-')===0){settings[t.id.slice(4)]=t.value;lsSet('lc4-settings',JSON.stringify(settings));if(view==='doc') renderDocMetaOnly();return}
  if(t.id==='tl-try'){
    const h=lookupKey(tlIndex,t.value),out=$('#tl-try-out');
    if(!t.value.trim()){out.textContent='Shows what the number matches, so you can check the columns before the shift.';return}
    if(!h){out.textContent='No match.';return}
    const en=h.entry,a=asmIndex[en.k],l=endInfo(en.ls),s=endInfo(en.ss),ln=linerOf(en);
    out.textContent=[en.tag,en.tl,en.desc,en.q>1?en.q+' pieces':'',en.pp!=null?en.pp.toFixed(2)+' m² each':'no area',
      l?'LS '+l.t:'',s?'SS '+s.t:'',ln===true?'lined':ln===false?'no liner':'',isAps(en)?'APS':'',a?'joined with '+a.members.filter(m=>m.k!==en.k).map(m=>m.tag).join(', '):'']
      .filter(Boolean).join(' · ')+(h.n>1?' (appears '+h.n+' times)':'');
    return;
  }
  if(!run||!t.matches('[data-note]')) return;
  const row=t.closest('[data-id]');
  (run.answers[row.dataset.id]||(run.answers[row.dataset.id]={})).note=t.value;
});
main.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='h-date'){
    hsel.date=t.value||null;hourlyExtra=null;
    if(hsel.date&&store.mode==='idb'&&slotStart(hsel.date,'Day',0)<loadedFrom){
      const a=slotStart(hsel.date,'Day',0),z=a+864e5;
      try{hourlyExtra={date:hsel.date,list:(await dbRange(a,z))||[]}}catch(err){hourlyExtra=null}
    }
    renderHourly();
  }
  else if(t.id==='h-shift'){hsel.shift=t.value;renderHourly()}
  else if(t.id==='l-failed'){logFailedOnly=t.checked;renderLog()}
  else if(t.id==='rl-press'){if(t.value==='pos'){rules.posOnly=true;rules.pressure=1000}else{rules.posOnly=false;rules.pressure=parseInt(t.value,10)||500}lsSet('lc5-rules',JSON.stringify(rules))}
  else if(t.id==='tl-file'&&t.files&&t.files[0]){
    const f=t.files[0];tlMsg=null;
    try{
      let rows;
      if(/\.xlsx?$/i.test(f.name)){
        if(!window.XLSX) throw new Error('Excel files cannot be read right now because the reader did not load. Save the sheet as CSV and upload that.');
        const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      }else rows=parseCsv(await f.text());
      rows=rows.filter(r=>r.some(x=>String(x).trim()!==''));
      if(rows.length<2) throw new Error('The file has no data rows.');
      imp={fileName:f.name,name:f.name.replace(/\.[^.]+$/,''),project:'',all:rows,hdr:1};
      recomputeImp();
    }catch(err){imp=null;tlMsg={t:'bad',m:(err&&err.message)||'Could not read that file.'}}
    t.value='';renderTaglist();
  }
  else if(t.id==='tl-hdr'&&imp){
    const n=parseInt(t.value,10);
    imp.hdr=Math.max(1,Math.min(Math.min(20,imp.all.length-1),isNaN(n)?1:n));
    recomputeImp();renderTaglist();
  }
  else if(t.id&&t.id.indexOf('tl-map-')===0&&imp){
    imp.map[t.id.slice(7)]=parseInt(t.value,10);renderTaglist();
  }
});
main.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='scanform') startRun($('#f-code').value);
});

boot();
</script>

<script>
/* Installable, and everything it needs is cached, so it keeps working with no signal. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredInstall=e;
  const b=document.getElementById('installbtn');
  if(b){b.hidden=false;b.onclick=async()=>{b.hidden=true;deferredInstall.prompt();deferredInstall=null}}
});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installbtn');if(b) b.hidden=true});
</script>
